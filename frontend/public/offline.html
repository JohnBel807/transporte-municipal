<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sin conexión — Transporte VR</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a; color: #e2e8f0;
      font-family: system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 2rem;
      text-align: center;
    }
    .card {
      background: #1e293b; border: 1px solid #334155;
      border-radius: 1rem; padding: 2.5rem; max-width: 380px; width: 100%;
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; }
    p { color: #94a3b8; font-size: 0.9rem; line-height: 1.6; margin-bottom: 1.5rem; }
    button {
      background: #2dd4bf; color: #0f172a; font-weight: 600;
      border: none; border-radius: 0.75rem; padding: 0.75rem 2rem;
      font-size: 0.9rem; cursor: pointer; width: 100%;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Sin conexión</h1>
    <p>
      No hay conexión a internet en este momento.<br/>
      El mapa y los datos en tiempo real no están disponibles,
      pero puedes ver la última información cargada.
    </p>
    <button onclick="window.location.reload()">
      Reintentar conexión
    </button>
  </div>
</body>
</html>
