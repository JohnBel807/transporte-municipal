# nginx.conf — configuración para SPA React con routing del lado del cliente

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para assets estáticos
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json
               application/javascript text/xml application/xml
               image/svg+xml;

    # Health check — usado por Railway y el HEALTHCHECK del Dockerfile
    location /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # Assets con hash en el nombre → cache inmutable 1 año
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: cualquier ruta desconocida devuelve index.html
    # React Router maneja el routing en el cliente
    location / {
        try_files $uri $uri/ /index.html;

        # Cabeceras de seguridad
        add_header X-Frame-Options "SAMEORIGIN"           always;
        add_header X-Content-Type-Options "nosniff"       always;
        add_header Referrer-Policy "strict-origin"        always;
        add_header Permissions-Policy "geolocation=(self)" always;
    }
}
