# railway.toml
# Configuración de despliegue para Railway
# Documentación: https://docs.railway.app/reference/config-as-code

[build]
builder = "DOCKERFILE"

# ── Servicio Backend (FastAPI / Python) ───────────────────────────────────────
[services.backend]
dockerfilePath  = "backend/Dockerfile"  # <--- Asegúrate de que esta sea la ruta real de tu Dockerfile backend
buildContext    = "."

# Release command: se ejecuta UNA VEZ antes de desplegar las nuevas instancias
releaseCommand  = "alembic upgrade head"

[services.backend.deploy]
numReplicas     = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[services.backend.healthcheck]
path            = "/health"
intervalSeconds = 30
timeoutSeconds  = 10
successThreshold = 1
failureThreshold = 3

[services.backend.variables]
APP_ENV                 = "production"
ZONE_CONFIG_DEFAULT   = "velez_ricaurte"
DB_POOL_MIN_SIZE      = "2"
DB_POOL_MAX_SIZE      = "10"
LOG_LEVEL             = "INFO"
METRICS_ENABLED       = "true"
WS_HEARTBEAT_INTERVAL = "30"
ETA_ALERT_THRESHOLD_SEC = "90"
ACCESS_TOKEN_EXPIRE_MIN  = "15"
REFRESH_TOKEN_EXPIRE_DAYS = "30"


# ── Servicio Frontend (React / Vite / Nginx) ──────────────────────────────────
[services.frontend]
dockerfilePath  = "frontend/deploy/frontend/Dockerfile"  # <--- Este SÍ usa el del frontend
buildContext    = "."

[services.frontend.build.args]
VITE_MAP_REGION       = "velez_ricaurte"
VITE_POLL_INTERVAL_MS = "3000"

[services.frontend.deploy]
numReplicas   = 1
restartPolicyType = "ON_FAILURE"

[services.frontend.healthcheck]
path            = "/health"
intervalSeconds = 30


# ── Base de datos PostgreSQL (plugin de Railway) ──────────────────────────────
[services.database]
plugin = "postgresql"