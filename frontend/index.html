<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a">
    <script>
      // Aplica el tema antes de pintar para evitar parpadeo
      (function () {
        try {
          var t = localStorage.getItem('veri_theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          if (t === 'dark') document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'dark' ? '#0f172a' : '#ffffff');
        } catch (e) { document.documentElement.classList.add('dark'); }
      })();
    </script>
    <link rel="icon" type="image/jpeg" href="/logo-veri.png" />
    <link rel="apple-touch-icon" href="/logo-veri.png" />
    <title>Panel de Administración — Transporte Municipal</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="manifest" href="/manifest.json">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
