<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#0f172a"/>
  <title>Colectivos — Velez &amp; Ricaurte</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    #app { display: flex; flex-direction: column; height: 100dvh; }
    header { background: #1e293b; border-bottom: 1px solid #334155; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    header h1 { font-size: 15px; font-weight: 600; }
    header p  { font-size: 12px; color: #64748b; }
    .badge { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 99px; border: 1px solid; }
    .badge-live { color: #2dd4bf; border-color: #2dd4bf33; background: #2dd4bf11; }
    .badge-none { color: #64748b; border-color: #33415533; background: transparent; }
    
    /* Ambos mapas con altura fija idéntica para evitar espacios vacíos */
    #map, #taxi-map { height: 210px !important; width: 100%; flex-shrink: 0; }

    .panel { background: #1e293b; border-top: 1px solid #334155; flex: 1; overflow-y: auto; }
    .tabs { display: flex; border-bottom: 1px solid #334155; position: sticky; top: 0; background: #1e293b; z-index: 10; flex-shrink: 0; }
    .tab { flex: 1; padding: 10px; text-align: center; font-size: 12px; font-weight: 600; color: #64748b; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; }
    .tab.active { color: #2dd4bf; border-bottom-color: #2dd4bf; }
    .route-card { padding: 12px 16px; border-bottom: 1px solid #0f172a; background: #0f172a; cursor: pointer; transition: background 0.15s; }
    .route-card:hover { background: #1e293b; }
    .route-card.selected { background: #134e4a22; border-left: 3px solid #2dd4bf; }
    .route-name { font-size: 14px; font-weight: 600; color: #f1f5f9; }
    .route-meta { font-size: 12px; color: #64748b; margin-top: 2px; }
    .route-row { display: flex; justify-content: space-between; align-items: center; }
    .seats { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; border: 1px solid; }
    .seats-ok   { color: #2dd4bf; border-color: #2dd4bf33; background: #2dd4bf11; }
    .seats-few  { color: #fbbf24; border-color: #fbbf2433; background: #fbbf2411; }
    .seats-full { color: #f87171; border-color: #f8717133; background: #f8717111; }
    .waypoint-item { padding: 10px 16px; border-bottom: 1px solid #0f172a; display: flex; align-items: center; gap: 12px; }
    .waypoint-item.passed { opacity: 0.4; }
    .waypoint-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid #2dd4bf; background: transparent; flex-shrink: 0; }
    .waypoint-dot.terminal { background: #2dd4bf; }
    .waypoint-dot.passed   { border-color: #475569; }
    .waypoint-info { flex: 1; min-width: 0; }
    .waypoint-name { font-size: 13px; font-weight: 500; color: #e2e8f0; }
    .waypoint-eta  { font-size: 11px; color: #64748b; margin-top: 2px; }
    .notify-btn { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 8px; border: 1px solid; cursor: pointer; transition: all 0.15s; white-space: nowrap; background: transparent; }
    .notify-btn.off { color: #64748b; border-color: #334155; }
    .notify-btn.off:hover { color: #2dd4bf; border-color: #2dd4bf; }
    .notify-btn.on { color: #0f172a; background: #2dd4bf; border-color: #2dd4bf; font-weight: 700; }
    .msg-panel { padding: 12px 16px; border-top: 1px solid #334155; background: #0f172a; }
    .msg-panel-title { font-size: 11px; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
    .msg-list { margin-bottom: 10px; max-height: 100px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .msg-bubble { padding: 6px 10px; border-radius: 8px; font-size: 12px; }
    .msg-bubble.pasajero { background: #1e293b; color: #e2e8f0; align-self: flex-start; }
    .msg-bubble.conductor { background: #134e4a; color: #2dd4bf; border: 1px solid #2dd4bf33; align-self: flex-end; }
    .quick-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .quick-btn { font-size: 11px; padding: 4px 8px; background: #1e293b; border: 1px solid #334155; border-radius: 6px; color: #94a3b8; cursor: pointer; transition: all 0.15s; }
    .quick-btn:hover { border-color: #2dd4bf; color: #2dd4bf; }
    .msg-input-row { display: flex; gap: 8px; }
    .msg-input { flex: 1; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 8px 12px; color: #e2e8f0; font-size: 13px; outline: none; transition: border-color 0.15s; }
    .msg-input:focus { border-color: #2dd4bf; }
    .msg-send { background: #2dd4bf; color: #0f172a; font-weight: 700; border: none; border-radius: 8px; padding: 8px 16px; font-size: 13px; cursor: pointer; transition: background 0.15s; }
    .msg-send:hover { background: #14b8a6; }
    .msg-send:disabled { opacity: 0.5; cursor: not-allowed; }
    .empty-state { text-align: center; padding: 32px 16px; color: #475569; font-size: 13px; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #2dd4bf; color: #0f172a; padding: 12px 20px; border-radius: 12px; font-size: 13px; font-weight: 600; box-shadow: 0 4px 20px #0004; z-index: 9999; max-width: 90vw; text-align: center; animation: slideUp 0.3s ease; }
    @keyframes slideUp { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    .leaflet-container { background: #0f172a !important; }
    /* Taxi */
    .taxi-panel { padding: 16px; background: #0f172a; }
    .taxi-input { width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 10px 12px; color: #e2e8f0; font-size: 13px; outline: none; margin-bottom: 8px; transition: border-color 0.15s; }
    .taxi-input:focus { border-color: #2dd4bf; }
    .taxi-option { display: flex; align-items: center; gap: 8px; padding: 8px 0; font-size: 13px; color: #94a3b8; cursor: pointer; }
    .taxi-option input[type="checkbox"] { width: 16px; height: 16px; accent-color: #2dd4bf; }
    .taxi-btn { width: 100%; background: #2dd4bf; color: #0f172a; font-weight: 700; border: none; border-radius: 10px; padding: 12px; font-size: 14px; cursor: pointer; transition: background 0.15s; margin-top: 8px; }
    .taxi-btn:hover { background: #14b8a6; }
    .taxi-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .taxi-btn-secondary { width: 100%; background: transparent; color: #64748b; font-weight: 600; border: 1px solid #334155; border-radius: 10px; padding: 10px; font-size: 13px; cursor: pointer; transition: all 0.15s; margin-top: 6px; }
    .taxi-btn-secondary:hover { border-color: #2dd4bf; color: #2dd4bf; }
    .fare-estimate { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .fare-total { font-size: 28px; font-weight: 800; color: #2dd4bf; text-align: center; display: block; }
    .fare-detail { font-size: 11px; color: #64748b; text-align: center; margin-top: 4px; }
    .driver-card { background: #1e293b; border: 1px solid #2dd4bf33; border-radius: 10px; padding: 12px; margin-bottom: 8px; }
    .trip-status { background: #134e4a22; border: 1px solid #2dd4bf33; border-radius: 10px; padding: 16px; text-align: center; }
    .taximeter { font-size: 40px; font-weight: 900; color: #fff; display: block; margin: 8px 0; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <div><h1>🚌 Transporte en linea</h1><p>Velez &amp; Ricaurte</p></div>
    <span id="status-badge" class="badge badge-none">Cargando...</span>
  </header>

  <!-- Pestañas de navegación -->
  <div class="tabs">
    <div class="tab active" id="tab-taxi" onclick="showTab('taxi')">🚕 Taxi</div>
    <div class="tab" id="tab-routes" onclick="showTab('routes')">Rutas</div>
    <div class="tab" id="tab-stops" onclick="showTab('stops')">Paradas</div>
  </div>

  <!-- Contenedor principal que alterna las vistas -->
  <div class="panel" style="display: flex; flex-direction: column; flex: 1; overflow-y: auto;">
    <!-- Vista de Taxi (Contiene su propio mapa interno #taxi-map) -->
    <div id="panel-taxi"></div>

    <!-- Vista de Rutas y Paradas (Contiene el mapa general de colectivos #map) -->
    <div id="panel-routes-container" style="display: none; flex-direction: column; flex: 1;">
      <div id="map"></div>
      <div id="panel-routes"></div>
      <div id="panel-stops" style="display:none;"></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API = 'https://api.velezyricaurte.com'
const POLL_MS = 10_000, NOTIFY_MS = 15_000, ALERT_MIN = 2

let routes = [], markers = {}, selected = null, waypoints = []
let watching = {}, notified = new Set(), currentTab = 'taxi'
let msgList = [], msgPollInterval = null
let taxiMap = null
let taxiMarkers = {}
let driverMarker = null

const map = L.map('map', { zoomControl: true }).setView([5.95, -73.68], 11)
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap', maxZoom: 18,
}).addTo(map)

function makeIcon(color, label = '') {
  return L.divIcon({
    className: '',
    html: `<div style="display:flex;flex-direction:column;align-items:center;gap:3px">
      <div style="background:#1e293b;border:1px solid ${color};color:${color};font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;white-space:nowrap;box-shadow:0 2px 8px #0006;max-width:120px;overflow:hidden;text-overflow:ellipsis;">${label}</div>
      <div style="width:10px;height:10px;background:${color};border:2px solid #0f172a;border-radius:50%;box-shadow:0 0 0 3px ${color}44;"></div>
    </div>`,
    iconSize: [120, 32], iconAnchor: [60, 32],
  })
}

function showTab(tab) {
  currentTab = tab
  
  // Actualizar clases activas de las pestañas
  document.getElementById('tab-taxi').classList.toggle('active',   tab === 'taxi')
  document.getElementById('tab-routes').classList.toggle('active', tab === 'routes')
  document.getElementById('tab-stops').classList.toggle('active',  tab === 'stops')
  
  const panelTaxi = document.getElementById('panel-taxi')
  const panelRoutesContainer = document.getElementById('panel-routes-container')
  const panelRoutes = document.getElementById('panel-routes')
  const panelStops = document.getElementById('panel-stops')

  if (tab === 'taxi') {
    panelTaxi.style.display = 'block'
    panelRoutesContainer.style.display = 'none'
    renderTaxi()
  } else {
    panelTaxi.style.display = 'none'
    panelRoutesContainer.style.display = 'flex'

    if (tab === 'routes') {
      panelRoutes.style.display = 'block'
      panelStops.style.display = 'none'
    } else if (tab === 'stops') {
      panelRoutes.style.display = 'none'
      panelStops.style.display = 'block'
    }

    // Recargar tamaño del mapa de Leaflet para evitar que se renderice gris
    setTimeout(() => {
      map.invalidateSize()
    }, 100)
  }
}

function seatsClass(s, c) { const p = s/c; return p > 0.3 ? 'seats-ok' : p > 0 ? 'seats-few' : 'seats-full' }
function seatsLabel(s) { return s <= 0 ? 'Lleno' : s === 1 ? '1 puesto' : `${s} puestos` }
function etaLabel(s) { if (!s || s <= 0) return ''; return s < 60 ? `${s}s` : `${Math.ceil(s/60)} min` }

function showToast(msg) {
  const el = document.createElement('div')
  el.className = 'toast'; el.textContent = msg
  document.body.appendChild(el); setTimeout(() => el.remove(), 4000)
}

async function requestNotifyPermission() {
  if (!('Notification' in window)) return false
  if (Notification.permission === 'granted') return true
  if (Notification.permission === 'denied') { showInstructions(); return false }
  return (await Notification.requestPermission()) === 'granted'
}

function showInstructions() {
  const isAndroid = /android/i.test(navigator.userAgent)
  const isIOS = /iphone|ipad/i.test(navigator.userAgent)
  alert(isAndroid
    ? 'Para activar notificaciones:\n1. Toca el candado en la barra\n2. Permisos\n3. Activa Notificaciones'
    : isIOS
      ? 'Para activar notificaciones:\n1. Ajustes del iPhone\n2. Safari > este sitio\n3. Activa Notificaciones'
      : 'Para activar:\n1. Clic en candado en la barra\n2. Notificaciones > Permitir')
}

function sendNotification(title, body) {
  if (Notification.permission === 'granted') new Notification(title, { body, vibrate: [200,100,200] })
  showToast(`🚌 ${title} — ${body}`)
}

async function toggleWatch(waypointId, placeName) {
  if (watching[waypointId]) {
    delete watching[waypointId]; notified.delete(waypointId)
    renderStops(); showToast(`Alerta desactivada para "${placeName}"`); return
  }
  if (!(await requestNotifyPermission())) return
  watching[waypointId] = true; notified.delete(waypointId)
  renderStops(); showToast(`Te avisaremos cuando el colectivo este cerca de "${placeName}"`)
}

function checkAlerts() {
  if (!selected || !waypoints.length) return
  for (const wp of waypoints) {
    if (!watching[wp.id] || notified.has(wp.id) || wp.already_passed) continue
    if (wp.eta_minutes !== null && wp.eta_minutes <= ALERT_MIN) {
      sendNotification(`Colectivo llegando a ${wp.place_name}`,
        `Llega en aprox. ${Math.ceil(wp.eta_minutes)} minuto${wp.eta_minutes <= 1 ? '' : 's'}`)
      notified.add(wp.id)
    }
  }
}

// ── Mensajes ──────────────────────────────────────────────────────────────────
async function sendMessage() {
  if (!selected) return
  const input = document.getElementById('msg-input')
  const msg = input.value.trim(); if (!msg) return
  const btn = document.getElementById('msg-send-btn'); btn.disabled = true
  try {
    const res = await fetch(`${API}/routes/public/${selected}/messages`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg }),
    })
    if (!res.ok) throw new Error()
    input.value = ''
    showToast('Mensaje enviado al conductor')
    await fetchMessages(selected)
  } catch { showToast('No se pudo enviar el mensaje') }
  finally { btn.disabled = false }
}

function setQuickMsg(text) {
  const input = document.getElementById('msg-input')
  if (input) input.value = text
}

function renderMessages() {
  const el = document.getElementById('msg-list'); if (!el) return
  if (!msgList.length) {
    el.innerHTML = '<p style="font-size:11px;color:#475569;text-align:center">Sin mensajes aun</p>'; return
  }
  el.innerHTML = [...msgList].map(m => `
    <div class="msg-bubble ${m.sender}">
      <span style="font-weight:600">${m.sender === 'conductor' ? '🚌 Conductor' : '👤 Tu'}:</span>
      ${m.message}
    </div>`).join('')
  el.scrollTop = el.scrollHeight
}

async function fetchMessages(routeId) {
  try {
    const res = await fetch(`${API}/routes/public/${routeId}/messages`)
    if (!res.ok) return
    msgList = await res.json()
    renderMessages()
  } catch {}
}

// ── Reservas ──────────────────────────────────────────────────────────────────
async function createReservation() {
  if (!selected) return
  const name  = (document.getElementById('res-name').value.trim()) || 'Pasajero'
  const seats = parseInt(document.getElementById('res-seats').value) || 1
  const note  = document.getElementById('res-note').value.trim()
  const btn   = document.getElementById('res-btn'); btn.disabled = true

  let lat = null, lng = null
  try {
    if (navigator.geolocation) {
      await new Promise(resolve => {
        navigator.geolocation.getCurrentPosition(
          pos => { lat = pos.coords.latitude; lng = pos.coords.longitude; resolve() },
          () => resolve(), { timeout: 5000 }
        )
      })
    }
  } catch {}

  try {
    const res = await fetch(`${API}/routes/public/${selected}/reservations`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ passenger_name: name, seats, pickup_note: note || null, pickup_lat: lat, pickup_lng: lng }),
    })
    const data = await res.json()
    if (!res.ok) throw new Error(data.detail)
    showToast(`✅ ${data.message}`)
    document.getElementById('res-name').value  = ''
    document.getElementById('res-note').value  = ''
    document.getElementById('res-seats').value = '1'
  } catch (err) {
    showToast(`❌ ${err.message || 'Error al reservar'}`)
  } finally { btn.disabled = false }
}

// ── Paradas ───────────────────────────────────────────────────────────────────
async function loadWaypoints(routeId) {
  try {
    const res = await fetch(`${API}/routes/public/${routeId}/waypoints`)
    if (!res.ok) return
    waypoints = await res.json()
    renderStops(); checkAlerts()
  } catch {}
}

function selectRoute(id) {
  selected = id; waypoints = []; watching = {}; notified = new Set(); msgList = []
  if (msgPollInterval) clearInterval(msgPollInterval)
  const r = routes.find(r => r.route_id === id)
  if (r) { map.flyTo([r.lat, r.lng], 14, { duration: 0.8 }); markers[id]?.openPopup() }
  loadWaypoints(id); showTab('stops'); renderRoutes()
  fetchMessages(id)
  msgPollInterval = setInterval(() => fetchMessages(id), 5_000)
}

function renderRoutes() {
  const badge = document.getElementById('status-badge')
  if (routes.length > 0) { badge.className = 'badge badge-live'; badge.textContent = `${routes.length} en linea` }
  else { badge.className = 'badge badge-none'; badge.textContent = 'Sin servicio' }

  const activeIds = new Set(routes.map(r => r.route_id))
  Object.keys(markers).forEach(id => { if (!activeIds.has(id)) { markers[id].remove(); delete markers[id] } })
  routes.forEach(r => {
    const color = r.signal_status === 'live' ? '#2dd4bf' : r.signal_status === 'stale' ? '#fbbf24' : '#f87171'
    const icon = makeIcon(color, r.route_name)
    const popup = `<div style="font-size:13px;line-height:1.6"><b>${r.route_name}</b><br/>
      ${r.passengers_aboard}/${r.capacity} pasajeros · ${r.speed_kmh} km/h<br/>
      → ${r.next_stop}${r.eta_seconds ? ` (${etaLabel(r.eta_seconds)})` : ''}</div>`
    if (markers[r.route_id]) { markers[r.route_id].setLatLng([r.lat, r.lng]).setIcon(icon); markers[r.route_id].getPopup()?.setContent(popup) }
    else { markers[r.route_id] = L.marker([r.lat, r.lng], { icon }).bindPopup(popup).on('click', () => selectRoute(r.route_id)).addTo(map) }
  })

  const el = document.getElementById('panel-routes')
  if (!routes.length) { el.innerHTML = `<div class="empty-state">No hay colectivos en servicio<br/><span style="font-size:24px;display:block;margin-top:12px">🕐</span></div>`; return }
  el.innerHTML = routes.map(r => `
    <div class="route-card ${selected === r.route_id ? 'selected' : ''}" onclick="selectRoute('${r.route_id}')">
      <div class="route-row">
        <span class="route-name">${r.route_name}</span>
        <span class="seats ${seatsClass(r.seats_available, r.capacity)}">${seatsLabel(r.seats_available)}</span>
      </div>
      <div class="route-meta">
        → ${r.next_stop} ${r.eta_seconds ? `· llega en ${etaLabel(r.eta_seconds)}` : ''}
        · $${Number(r.base_fare).toLocaleString('es-CO')}
      </div>
    </div>`).join('')
}

function renderStops() {
  const el = document.getElementById('panel-stops')
  if (!selected) { el.innerHTML = `<div class="empty-state">Selecciona una ruta para ver sus paradas</div>`; return }
  if (!waypoints.length) { el.innerHTML = `<div class="empty-state">Cargando paradas...</div>`; return }

  const waypointsHtml = waypoints.map(wp => {
    const passed = wp.already_passed, isWatch = watching[wp.id]
    const etaTxt = wp.eta_minutes !== null ? `~${Math.ceil(wp.eta_minutes)} min`
      : wp.distance_m ? `${(wp.distance_m/1000).toFixed(1)} km` : 'Sin datos'
    return `
      <div class="waypoint-item ${passed ? 'passed' : ''}">
        <div class="waypoint-dot ${wp.is_terminal ? 'terminal' : ''} ${passed ? 'passed' : ''}"></div>
        <div class="waypoint-info">
          <div class="waypoint-name">${wp.place_name}</div>
          <div class="waypoint-eta">${passed ? 'Ya paso' : etaTxt}</div>
        </div>
        ${!passed ? `<button class="notify-btn ${isWatch ? 'on' : 'off'}"
          onclick="toggleWatch('${wp.id}', '${wp.place_name.replace(/'/g, "\\'")}')">
          ${isWatch ? '🔔 Activado' : '🔕 Avisar'}</button>` : ''}
      </div>`
  }).join('')

  const msgHtml = `
    <div class="msg-panel">
      <p class="msg-panel-title">📨 Mensaje al conductor</p>
      <div class="msg-list" id="msg-list"></div>
      <div class="quick-btns">
        <button class="quick-btn" onclick="setQuickMsg('Espereme por favor 🙏')">Espereme 🙏</button>
        <button class="quick-btn" onclick="setQuickMsg('Voy con un paquete 📦')">Paquete 📦</button>
        <button class="quick-btn" onclick="setQuickMsg('Somos 2 personas 👥')">2 personas 👥</button>
        <button class="quick-btn" onclick="setQuickMsg('Cuanto falta? ⏱️')">Cuanto falta ⏱️</button>
      </div>
      <div class="msg-input-row">
        <input id="msg-input" class="msg-input" maxlength="140"
          placeholder="Escribe un mensaje... (max 140 caracteres)"
          onkeydown="if(event.key==='Enter') sendMessage()"/>
        <button id="msg-send-btn" class="msg-send" onclick="sendMessage()">Enviar</button>
      </div>
    </div>`

  const reservationHtml = `
    <div class="msg-panel" style="border-top:1px solid #334155">
      <p class="msg-panel-title">🎫 Reservar puesto</p>
      <div style="display:grid;grid-template-columns:1fr 90px;gap:8px;margin-bottom:8px">
        <input id="res-name" class="msg-input" placeholder="Tu nombre (opcional)" maxlength="60"/>
        <select id="res-seats" class="msg-input" style="padding:8px;cursor:pointer">
          <option value="1">1 puesto</option>
          <option value="2">2 puestos</option>
          <option value="3">3 puestos</option>
          <option value="4">4 puestos</option>
        </select>
      </div>
      <input id="res-note" class="msg-input" style="width:100%;margin-bottom:8px"
        placeholder="Donde te recogemos? (ej: frente a la farmacia)" maxlength="140"/>
      <button id="res-btn" class="msg-send" style="width:100%" onclick="createReservation()">
        🎫 Reservar puesto
      </button>
      <p style="font-size:10px;color:#475569;margin-top:6px;text-align:center">
        Si permites la ubicacion, el conductor sabra exactamente donde recogerme
      </p>
    </div>`

  el.innerHTML = waypointsHtml + msgHtml + reservationHtml
  renderMessages()
}

async function fetchRoutes() {
  try {
    const res = await fetch(`${API}/routes/public/active`)
    if (!res.ok) throw new Error(res.status)
    routes = await res.json()
  } catch {}
  renderRoutes()
  if (selected) loadWaypoints(selected)
}

fetchRoutes()
setInterval(fetchRoutes, POLL_MS)
setInterval(checkAlerts, NOTIFY_MS)

// ── Estado taxi ───────────────────────────────────────────────────────────────
let taxiStep    = 'form'    // form | searching | trip
let activeTripId = null
let taxiPollInterval = null
let fareEstimate = null

// ── Render taxi ───────────────────────────────────────────────────────────────
function renderTaxi() {
  const el = document.getElementById('panel-taxi')

  if (taxiStep === 'form') {
    el.innerHTML = `
      <div id="taxi-map" style="height:210px;width:100%;border-bottom:1px solid #334155"></div>
      <div class="taxi-panel">
        <p style="font-size:13px;font-weight:600;color:#e2e8f0;margin-bottom:12px">
          🚕 Solicitar taxi
        </p>
        <input id="taxi-origin" class="taxi-input"
          placeholder="📍 ¿Dónde estás? (dirección o referencia)"
          maxlength="200"/>
        <input id="taxi-dest" class="taxi-input"
          placeholder="🏁 ¿A dónde vas? (dirección o referencia)"
          maxlength="200"/>
        <input id="taxi-name" class="taxi-input"
          placeholder="Tu nombre (opcional)" maxlength="60"/>
        <input id="taxi-phone" class="taxi-input"
          placeholder="Tu teléfono (opcional)" maxlength="20" type="tel"/>
        <label class="taxi-option">
          <input type="checkbox" id="taxi-luggage"/>
          <span>Llevo equipaje o carga (+$2.000)</span>
        </label>
        <label class="taxi-option">
          <input type="checkbox" id="taxi-ac"/>
          <span>Con aire acondicionado (+$1.000)</span>
        </label>
        ${fareEstimate ? `
          <div class="fare-estimate" style="margin-top:12px">
            <span class="fare-total">
              ~$${fareEstimate.fare_total.toLocaleString('es-CO')}
            </span>
            <p class="fare-detail">
              Estimado · ~${fareEstimate.km.toFixed(1)} km ·
              ${fareEstimate.minutes} min
            </p>
          </div>` : ''}
        <button class="taxi-btn" id="taxi-estimate-btn" onclick="estimateFare()">
          Ver estimado de tarifa
        </button>
        <button class="taxi-btn" id="taxi-request-btn" onclick="requestTaxi()"
          style="background:#0f172a;color:#2dd4bf;border:1px solid #2dd4bf;margin-top:6px">
          Solicitar taxi
        </button>
      </div>`

    setTimeout(() => initTaxiMap(), 100)
  }

  if (taxiStep === 'searching') {
    el.innerHTML = `
      <div class="taxi-panel">
        <div class="trip-status">
          <div style="font-size:32px;margin-bottom:8px">🔍</div>
          <p style="font-size:14px;font-weight:600;color:#e2e8f0">
            Buscando conductor...
          </p>
          <p style="font-size:12px;color:#64748b;margin-top:4px">
            Tu solicitud fue enviada. Espera mientras un conductor la acepta.
          </p>
          <div style="margin-top:16px">
            <span style="display:inline-block;width:8px;height:8px;
              background:#2dd4bf;border-radius:50%;animation:pulse 1.5s infinite"/>
          </div>
        </div>
        <button class="taxi-btn-secondary" onclick="cancelTaxi()">
          Cancelar solicitud
        </button>
      </div>`
  }

  if (taxiStep === 'trip') {
    el.innerHTML = `
      <div id="taxi-map" style="height:210px;width:100%;border-bottom:1px solid #334155"></div>
      <div class="taxi-panel" id="trip-panel">
        <p style="font-size:11px;color:#64748b;margin-bottom:8px">
          Cargando estado del viaje...
        </p>
      </div>`
    setTimeout(() => {
      initTaxiMap()
      pollTripStatus()
    }, 100)
  }
}

// ── Mapa de taxi ──────────────────────────────────────────────────────────────
function initTaxiMap() {
  const container = document.getElementById('taxi-map')
  if (!container) return

  if (taxiMap) { taxiMap.remove(); taxiMap = null; taxiMarkers = {} }

  taxiMap = L.map('taxi-map', { zoomControl: false })
    .setView([5.9333, -73.6167], 13)
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap', maxZoom: 18,
  }).addTo(taxiMap)

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      const lat = pos.coords.latitude
      const lng = pos.coords.longitude
      taxiMap.setView([lat, lng], 14)

      L.marker([lat, lng], {
        icon: L.divIcon({
          className: '',
          html: `<div style="width:14px;height:14px;background:#6366f1;
                            border:2px solid #0f172a;border-radius:50%;
                            box-shadow:0 0 0 4px #6366f133"></div>`,
          iconSize: [14, 14], iconAnchor: [7, 7],
        })
      }).bindPopup('Tu ubicación').addTo(taxiMap)

      loadNearbyDrivers(lat, lng)
    }, () => loadNearbyDrivers(5.9333, -73.6167))
  } else {
    loadNearbyDrivers(5.9333, -73.6167)
  }
}

async function loadNearbyDrivers(lat, lng) {
  try {
    const res = await fetch(
      `${API}/taxi/drivers/nearby?lat=${lat}&lng=${lng}&radius_km=10`
    )
    if (!res.ok) return
    const drivers = await res.json()

    Object.values(taxiMarkers).forEach(m => m.remove())
    taxiMarkers = {}

    if (drivers.length === 0) {
      showToast('No hay taxis disponibles cerca en este momento')
      return
    }

    drivers.forEach(d => {
      const marker = L.marker([d.lat ?? 5.9333, d.lng ?? -73.6167], {
        icon: L.divIcon({
          className: '',
          html: `
            <div style="display:flex;flex-direction:column;align-items:center;gap:2px">
              <div style="background:#1e293b;border:1px solid #fbbf24;
                          color:#fbbf24;font-size:10px;font-weight:600;
                          padding:1px 5px;border-radius:4px;white-space:nowrap">
                🚕 ${d.full_name.split(' ')[0]}
              </div>
              <div style="width:10px;height:10px;background:#fbbf24;
                          border:2px solid #0f172a;border-radius:50%;
                          box-shadow:0 0 0 3px #fbbf2444"></div>
            </div>`,
          iconSize: [80, 30], iconAnchor: [40, 30],
        })
      })
      .bindPopup(`
        <div style="font-size:13px;line-height:1.6">
          <b>${d.full_name}</b><br/>
          ${d.plate} · ${d.brand} ${d.model}<br/>
          ★ ${d.avg_rating.toFixed(1)} · ${d.distance_km.toFixed(1)} km<br/>
          ETA ~${d.eta_min} min
        </div>`)
      .addTo(taxiMap)

      taxiMarkers[d.driver_id] = marker
    })
  } catch (e) {
    console.warn('Error cargando taxis:', e)
  }
}

async function estimateFare() {
  const btn = document.getElementById('taxi-estimate-btn')
  btn.disabled = true; btn.textContent = 'Calculando...'

  let lat = 5.877, lng = -73.669
  try {
    await new Promise(resolve => {
      navigator.geolocation.getCurrentPosition(
        pos => { lat = pos.coords.latitude; lng = pos.coords.longitude; resolve() },
        () => resolve(), { timeout: 5000 }
      )
    })
  } catch {}

  try {
    const res = await fetch(`${API}/taxi/drivers/nearby?lat=${lat}&lng=${lng}`)
    if (!res.ok) throw new Error()
    const drivers = await res.json()

    fareEstimate = {
      fare_total: 8750,
      km:         2.5,
      minutes:    8,
    }
  } catch {
    showToast('No se pudo calcular el estimado')
  } finally {
    btn.disabled = false; btn.textContent = 'Ver estimado de tarifa'
    renderTaxi()
  }
}

async function requestTaxi() {
  if (activeTripId) {
    showToast('Ya tienes un viaje activo')
    return
  }

  const origin  = document.getElementById('taxi-origin').value.trim()
  const dest    = document.getElementById('taxi-dest').value.trim()
  const name    = document.getElementById('taxi-name').value.trim()
  const phone   = document.getElementById('taxi-phone').value.trim()
  const luggage = document.getElementById('taxi-luggage').checked
  const ac      = document.getElementById('taxi-ac').checked

  if (!origin) { showToast('Escribe tu punto de recogida'); return }
  if (!dest)   { showToast('Escribe tu destino'); return }

  const btn = document.getElementById('taxi-request-btn')
  btn.disabled = true; btn.textContent = 'Enviando...'

  let lat = 5.877, lng = -73.669
  try {
    await new Promise(resolve => {
      navigator.geolocation.getCurrentPosition(
        pos => { lat = pos.coords.latitude; lng = pos.coords.longitude; resolve() },
        () => resolve(), { timeout: 5000 }
      )
    })
  } catch {}

  try {
    const res = await fetch(`${API}/taxi/request`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        origin_lat: lat, origin_lng: lng,
        origin_address: origin,
        dest_lat: lat, dest_lng: lng,
        dest_address: dest,
        passenger_name: name || 'Pasajero',
        passenger_phone: phone,
        has_luggage: luggage,
        has_ac: ac,
      }),
    })
    const data = await res.json()
    if (!res.ok) throw new Error(data.detail)

    activeTripId = data.trip_id
    fareEstimate = data.estimated_fare
    taxiStep     = 'searching'
    renderTaxi()

    taxiPollInterval = setInterval(async () => {
      try {
        const r = await fetch(`${API}/taxi/trips/${activeTripId}/status`)
        const d = await r.json()
        if (d.status !== 'solicitado') {
          clearInterval(taxiPollInterval)
          taxiStep = 'trip'
          renderTaxi()
        }
      } catch {}
    }, 5000)

  } catch (err) {
    showToast(`❌ ${err.message || 'Error al solicitar taxi'}`)
    btn.disabled = false; btn.textContent = 'Solicitar taxi'
  }
}

async function cancelTaxi() {
  if (!activeTripId) { resetTaxi(); return }
  try {
    await fetch(`${API}/taxi/trips/${activeTripId}/cancel`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reason: 'Cancelado por pasajero' }),
    })
  } catch {}
  clearInterval(taxiPollInterval)
  resetTaxi()
  showToast('Solicitud cancelada')
}

function resetTaxi() {
  taxiStep     = 'form'
  activeTripId = null
  fareEstimate = null
  driverMarker = null
  clearInterval(taxiPollInterval)
  renderTaxi()
}

async function pollTripStatus() {
  if (!activeTripId) return
  try {
    const res  = await fetch(`${API}/taxi/trips/${activeTripId}/status`)
    const trip = await res.json()
    renderTripPanel(trip)

    if (taxiMap && trip.driver &&
        trip.driver.lat && trip.driver.lng) {
      const pos = [trip.driver.lat, trip.driver.lng]
      if (driverMarker) {
        driverMarker.setLatLng(pos)
      } else {
        driverMarker = L.marker(pos, {
          icon: L.divIcon({
            className: '',
            html: `
              <div style="display:flex;flex-direction:column;align-items:center;gap:2px">
                <div style="background:#1e293b;border:1px solid #fbbf24;
                            color:#fbbf24;font-size:10px;font-weight:600;
                            padding:1px 5px;border-radius:4px;white-space:nowrap">
                  🚕 ${trip.driver.name?.split(' ')[0] ?? 'Conductor'}
                </div>
                <div style="width:12px;height:12px;background:#fbbf24;
                            border:2px solid #0f172a;border-radius:50%;
                            box-shadow:0 0 0 4px #fbbf2444"></div>
              </div>`,
            iconSize: [80, 30], iconAnchor: [40, 30],
          })
        }).bindPopup(`
          <b>${trip.driver.name}</b><br/>
          ${trip.driver.plate}`
        ).addTo(taxiMap)
      }
      taxiMap.panTo(pos)
    }

    if (trip.status === 'completado' || trip.status === 'cancelado') {
      clearInterval(taxiPollInterval)
      driverMarker = null
    } else {
      setTimeout(pollTripStatus, 5000)
    }
  } catch {}
}

function renderTripPanel(trip) {
  const el = document.getElementById('trip-panel')
  if (!el) return

  const STATUS = {
    aceptado:   { icon: '🚗', text: 'Conductor en camino' },
    en_camino:  { icon: '🚗', text: 'Conductor en camino' },
    esperando:  { icon: '⏳', text: 'Conductor llegó — baja ya' },
    en_curso:   { icon: '🛣️', text: 'Viaje en curso' },
    completado: { icon: '✅', text: 'Viaje completado' },
    cancelado:  { icon: '❌', text: 'Viaje cancelado' },
  }
  const st = STATUS[trip.status] ?? { icon: '🔄', text: trip.status }

  el.innerHTML = `
    <div class="trip-status">
      <div style="font-size:32px">${st.icon}</div>
      <p style="font-size:14px;font-weight:700;color:#e2e8f0;margin-top:8px">
        ${st.text}
      </p>

      ${trip.driver ? `
        <div class="driver-card" style="margin-top:12px;text-align:left">
          <p style="font-size:13px;font-weight:600;color:#e2e8f0">
            ${trip.driver.name}
          </p>
          <p style="font-size:12px;color:#64748b">
            ${trip.driver.plate} · ${trip.driver.brand} ${trip.driver.model}
          </p>
        </div>
      ` : ''}

      ${trip.status === 'en_curso' && trip.fare_current ? `
        <span class="taximeter">
          $${trip.fare_current.fare_total.toLocaleString('es-CO')}
        </span>
        <p style="font-size:12px;color:#64748b">
          ${trip.fare_current.km.toFixed(1)} km ·
          ${trip.fare_current.minutes} min
        </p>
      ` : ''}

      ${trip.status === 'completado' && trip.fare_total ? `
        <span class="taximeter" style="color:#2dd4bf">
          $${trip.fare_total.toLocaleString('es-CO')}
        </span>
        <p style="font-size:12px;color:#64748b">Total del viaje</p>
        <button class="taxi-btn" onclick="resetTaxi()" style="margin-top:16px">
          Nuevo viaje
        </button>
      ` : ''}

      ${trip.status === 'cancelado' ? `
        <button class="taxi-btn" onclick="resetTaxi()" style="margin-top:16px">
          Volver
        </button>
      ` : ''}
    </div>

    ${trip.status !== 'completado' && trip.status !== 'cancelado' ? `
      <button class="taxi-btn-secondary" onclick="cancelTaxi()">
        Cancelar viaje
      </button>
    ` : ''}`

  if (trip.status !== 'completado' && trip.status !== 'cancelado') {
    setTimeout(pollTripStatus, 5000)
  }
}

// Inicializar por defecto en la pestaña Taxi al cargar la página
renderTaxi()
fetchRoutes()
setInterval(fetchRoutes, POLL_MS)
setInterval(checkAlerts, NOTIFY_MS)
</script>
